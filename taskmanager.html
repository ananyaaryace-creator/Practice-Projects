<!DOCTYPE html>
<html>
    <head>
        <title>Student Task Manager</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                max-width: 400px;
                margin: 50px auto;
            }
            input{
                padding: 8px;
                font-size: 16px;
            }
            button{
                padding: 8px 14px;
                font-size: 16px;
                cursor: pointer;
            }
            ul{
                list-style: none;
                padding: 0;
            }
            li {
                padding: 10px 0;
                border-bottom: 1px solid #ccc;
                .completed {
                text-decoration: line-through;
                color: #999;
}
}
        </style>
    </head>
    <body>
        <h1>Student Task Manager</h1>
        <input type="text" id="taskInput" placeholder="What do you need to do?">
        <button id="addBtn">Add</button>
        <div id="summary"></div>
        <ul id="tasklist"></ul>
        <script>
            const banana= document.getElementById('taskInput');
            const apple= document.getElementById('addBtn');
            const litchi= document.getElementById('tasklist');
            const summary = document.getElementById('summary');


            function addTask() {
                const text= taskInput.value;

                if (text === ''){
                    return;
                }
                const li= document.createElement('li');
                li.textContent = text;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';

                checkbox.addEventListener('change', function() {li.classList.toggle('completed');updateSummary(); });

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'delete';
                 deleteBtn.addEventListener('click', function() {li.remove();updateSummary();});

                 li.appendChild(checkbox);
                li.appendChild(deleteBtn);
                tasklist.appendChild(li);
                taskInput.value='';

                updateSummary();
            }
            function updateSummary() {
                const allTasks = tasklist.querySelectorAll('li');
                const completedTasks = tasklist.querySelectorAll('li.completed');

                const total = allTasks.length;
                const completed = completedTasks.length;
                const pending = total - completed;

                summary.textContent = `${pending} pending · ${completed} completed`;
            }


            addBtn.addEventListener('click', addTask);
        </script>
    </body>
</html>
